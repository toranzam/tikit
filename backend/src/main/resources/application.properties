spring.application.name=tikit
server.port=8080

# Flyway 공통 설정
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator 공통 설정
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# RAG: DB vector(1536)과 일치해야 하며 모델 변경 시 재인덱싱이 필요하다.
rag.embedding.model=text-embedding-3-small
rag.embedding.dimensions=1536
rag.embedding.api-key=${OPENAI_API_KEY:}

# 청크/임베딩 처리기 구현을 연결한 뒤 활성화한다.
rag.indexing.enabled=${RAG_INDEXING_ENABLED:false}
rag.indexing.batch-size=${RAG_INDEXING_BATCH_SIZE:10}
rag.indexing.poll-interval-ms=${RAG_INDEXING_POLL_INTERVAL_MS:5000}
